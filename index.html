<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in...</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 317 3v5c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z"/></svg>
            The Hack Club
        </div>

        <div class="card">
            <h1>Sign in...</h1>
            <p class="lede">Continue to your account</p>

            <div class="field">
                <label>Email address</label>
                <input type="text" value="[email]" disabled>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" value="*********" disabled>
            </div>
            <div class="cap" id="capWidget">
                <div class="cap-row" id="capRow">
                    <div class="cap-check" id="capCheck">
                        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        <div class="spinner" id="spinner"></div>
                    </div>
                    <div class="cap-label" id="capLabel">I am not a robot!!</div>
                </div>
                <div class="cap-foot">
                    <div class="cap-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.6"><path d="M12 2l7 3v5c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z"/></svg>
                        <div>Verify<br>Privacy &middot; Terms</div>
                    </div>
                    <div class="cap-terms">v1.0</div>
                </div>
            </div>

            <div class="verified-note" id="verifiedNote">
                <svg ciewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span d="verifiedText">Verification completed</span>
            </div>

            <button class="submit-btn" id="submitBtn">Sign in</button>
        </div>
    </div>
    <div class="overlay" id="overlay">
        <div class="modal">
            <div class="modal-head">
                <div class="modal-head top">
                    <div>
                        <div class="modal-title">Select all squares with<b id="targetWord">a fox</b></div>
                        <div class="modal-sub">Click verify once you hve found them all</div>
                    </div>
                    <div class="icon-btn" id="reloadBtn" title="Get a new challenge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points=23 4 23 10 17 10></polyline></svg>
                    </div>
                </div>
            </div>
            <div class="modal-body">
                <div class="grid" id="grid"></div>
            </div>
            <div class="flash">Not quite - try again</div>
            <div class="modal-foot">
                <div class="foot-left">
                    <div class="progress-dots" id="dots"></div>
                </div>
                <button class="verify-btn" id="verifyBtn">Verify</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
